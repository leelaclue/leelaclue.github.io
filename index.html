<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LeelaClue</title>
    <link rel="canonical" href="https://leelaclue.com/en/" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <noscript>
        <meta http-equiv="refresh" content="0;url=en/">
    </noscript>
    <script>
        (function () {
            const userLang = navigator.language || navigator.userLanguage;
            const storedLang = localStorage.getItem('lang');
            let lang = storedLang || userLang.split('-')[0];
            if (!['en', 'de', 'ru'].includes(lang)) lang = 'en';

            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            window.location.replace(lang + '/' + currentPage + window.location.search + window.location.hash);
        })();
    </script>
</head>

<body>
    <noscript>
        <p><a href="en/">Continue to LeelaClue (English version)</a></p>
    </noscript>
</body>

</html>
