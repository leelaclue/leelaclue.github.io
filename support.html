<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LeelaClue</title>
    <link rel="canonical" href="https://leelaclue.com/en/support.html" />
    <noscript>
        <meta http-equiv="refresh" content="0;url=en/support.html">
    </noscript>
    <script>
        (function () {
            const userLang = navigator.language || navigator.userLanguage;
            const storedLang = localStorage.getItem('lang');
            let lang = storedLang || userLang.split('-')[0];
            if (!['en', 'de', 'ru'].includes(lang)) lang = 'en';

            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            window.location.replace(lang + '/' + currentPage + window.location.search + window.location.hash);
        })();
    </script>
</head>

<body>
    <noscript>
        <p><a href="en/support.html">Continue to LeelaClue (English version)</a></p>
    </noscript>
</body>

</html>
